# M8 (moved from M8a): heliocentric vs GEO optical with ERA5 weather at the example_site receiver,
# ten weather years each (M7b comparison machinery; mass proxy as comparison.yaml, assumed).
#   helioswarm compare configs/comparison/era5/comparison_era5_example_site.yaml \
#       --runs-dir $HELIOSWARM_RUNS_DIR/comparison_era5 --out $HELIOSWARM_RUNS_DIR/comparison_era5/report_example_site
comparison_schema_version: 1
name: geo_vs_helio_era5_example_site
description: "M8: GEO vs heliocentric 1 au optical with ERA5 weather (2014-2023) at the example_site site"
mass_proxy:
  collector_areal_mass_kg_m2: 1.0
  transmitter_areal_mass_kg_m2: 50.0
  bus_mass_kg: 500.0
cases:
  - label: helio_1au_optical_era5
    sweep: helio_1au_optical_era5_sweep.yaml
  - label: geo_optical_era5
    sweep: geo_optical_era5_sweep.yaml
