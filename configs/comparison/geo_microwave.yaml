# Harmonised comparison: GEO microwave case (PDF §2 "A GEO solar-power system is a comparison
# baseline"). Technology: _microwave.yaml (+ _shared.yaml); this file sets only the orbit and
# the near-field beam model of this propagation regime.
#
# Orbit: geostationary preset above the receiver site (0 deg E): circular, in the IAU_EARTH
# equator of 2030-01-01, radius (GM_earth/omega^2)^(1/3) = 42164.17 km with omega the
# IAU_EARTH spin rate (pck00011), L0 Earth point mass. Lunisolar, J2 and SRP perturbations are
# omitted: station-keeping is the modelled assumption (docs/model_assumptions.md "M7b"; its
# propellant/mass is not in the mass proxy). Earth-shadow eclipses (equinox seasons, up to
# ~72 min/day incl. penumbra) come from the same conical-shadow illumination model as the
# heliocentric case.
extends: _microwave.yaml

project:
  name: "cmp_geo_microwave"
  seed: 20261113
  description: "M7b harmonised comparison: GEO above the receiver site (0 deg E), microwave"

orbit:
  model: "two_body_kepler"
  initial_epoch_utc: "2030-01-01T00:00:00"
  elements_center: "EARTH"
  elements_frame: "J2000"
  geostationary_longitude_deg: 0.0

models:
  # Fresnel-Hankel: N_F = 0.23, formally far field, but the near-field model is used for
  # every GEO case (it agrees with aperture_far_field to ~1e-4 in capture here). Evaluated on
  # the validated Chebyshev (range, elevation) table (helioswarm.beam_table).
  beam: "fresnel_hankel"
  beam_evaluation: "chebyshev_table"
