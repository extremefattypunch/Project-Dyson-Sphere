name: CI

on:
  push:
    branches: [main, "helioswarm-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --all-extras --locked
      # SPICE kernels (~33 MB, public NAIF data) are cached keyed on the manifest, so a change of
      # any URL or checksum in data/kernels/kernels.json re-fetches; fetch_kernels verifies size,
      # SHA-256 and NAIF MD5 of cached and downloaded files alike.
      - name: Cache SPICE kernels
        uses: actions/cache@v4
        with:
          path: |
            data/kernels/*.tls
            data/kernels/*.tpc
            data/kernels/*.bsp
          key: spice-kernels-${{ hashFiles('data/kernels/kernels.json') }}
      - name: Fetch and verify SPICE kernels
        run: uv run --locked python scripts/fetch_kernels.py
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Mypy (strict, src)
        run: uv run --locked mypy src
      - name: Pytest
        run: uv run --locked pytest -q
