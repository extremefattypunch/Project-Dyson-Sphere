[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helioswarm"
dynamic = ["version"]
description = "Reproducible feasibility simulator for a heliocentric solar-power swarm beaming power to Earth receivers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - all rights reserved until a licence is chosen" }
authors = [{ name = "helioswarm contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    "spiceypy>=6.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "pyarrow>=14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
]
# Independent cross-check libraries (tests importorskip them).
xcheck = [
    "rebound>=4.0",
    "hcipy>=0.6",
]
# ITU-R P.618 / P.676 / P.840 Earth-space attenuation (models.atmosphere = "itu_r", microwave).
# itur bundles the ITU-R digital maps (~170 MB installed); nothing is downloaded at run time.
itur = [
    "itur>=0.4.0,<0.5",
]
# Optional JAX backend of the batched Airy capture kernel (helioswarm.capture_batch; selected by
# `--backend jax`). CPU jaxlib only: enough to run the backend and its reference tests anywhere.
jax = [
    "jax>=0.12,<0.13; python_version >= '3.12'",
]
# GPU (CUDA 12) build of the same backend: jaxlib CUDA plugin + NVIDIA runtime wheels (~4.4 GB of
# nvidia-* wheels). Only for the gpu_test benchmark job; never needed for the CPU reference.
gpu = [
    "jax[cuda12]>=0.12,<0.13; python_version >= '3.12' and sys_platform == 'linux'",
]

[project.scripts]
helioswarm = "helioswarm.cli:main"

[tool.hatch.version]
path = "src/helioswarm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/helioswarm"]

[tool.hatch.build.targets.sdist]
include = ["src/helioswarm", "configs", "tests", "README.md", "pyproject.toml"]

# ---------------------------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["gpt-insights"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
]
ignore = [
    # Physics names legitimately mix case (e.g. flux_W_m2, temperature_K, T_space_K).
    "N802",
    "N803",
    "N806",
    "N815",
    "N816",
    # Greek letters / unit symbols in docstrings and comments are intentional.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["helioswarm"]
known-local-folder = ["config_helpers", "geometry_helpers"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["spiceypy.*", "rebound.*", "hcipy.*", "scipy.*", "itur.*", "pyarrow.*", "jax.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "slow: long-running test (still run in the acceptance gates)",
    "spice: requires the SPICE kernel set (see data/kernels/README.md)",
    "xcheck: independent cross-check against an optional library (rebound, hcipy)",
    "gpu: needs a real CUDA device for the JAX backend (skipped without one; run by slurm/gpu_bench.sbatch)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["helioswarm"]
branch = true
